<!doctype html>
<html lang="en"><head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230f7b6c%27/%3E%3C/svg%3E"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKV RMS</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OKV RMS">
<style>
:root{--ink:#1b2430;--mut:#667386;--line:#d9dfe6;--bg:#edf0f3;--card:#fff;--pri:#0f7b6c;--pri2:#0a5c51;--amb:#e8a317;--red:#c8372d;--soft:#e4f2ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 13px}
button:hover{border-color:var(--pri)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.pri:hover{background:var(--pri2)}
button.dng{color:var(--red)}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 3px}
header{background:#14312c;color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;position:sticky;top:0;z-index:5}
header b{font-size:16px;white-space:nowrap;padding:12px 0}
nav{display:flex;flex-wrap:wrap;gap:0 2px;flex:1}
nav button{background:none;border:0;border-radius:0;color:#cfe3de;padding:12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--amb)}
.who{display:flex;gap:8px;align-items:center;white-space:nowrap;font-size:13px}
.who button{background:none;color:#cfe3de;border-color:#3b5c55;padding:4px 9px}
main{padding:14px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .grow{flex:1;min-width:180px}
.bar input,.bar select{width:auto}
h2{margin:0 0 12px;font-size:18px}
h3{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:600;background:#f7f9fa}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:20px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tag{display:inline-block;border-radius:5px;padding:1px 8px;font-size:12px;font-weight:600;background:#e8ecf0;color:var(--mut)}
.tag.ok{background:var(--soft);color:var(--pri2)} .tag.warn{background:#fdf0d0;color:#8a5b00} .tag.bad{background:#fbe3e0;color:var(--red)}
.pos{display:grid;grid-template-columns:1fr 390px;gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:9px}
.tile{text-align:left;padding:10px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:#fff}
.tile:hover{background:var(--soft)}
.tile .n{font-weight:600;line-height:1.2}
.tile .p{color:var(--pri2);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:4px;font-size:14px}
.tile small{color:var(--mut)}
.tile.out{opacity:.5}
.ticket{background:#fff;border:1px solid var(--line);border-top:3px dashed #aab4be;border-bottom:3px dashed #aab4be;border-radius:4px;padding:12px;position:sticky;top:62px;max-height:calc(100vh - 76px);display:flex;flex-direction:column}
.lines{overflow-y:auto;flex:1;min-height:120px;margin:8px 0}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-bottom:1px dotted var(--line)}
.line .nm{font-weight:600}
.line .nt{color:var(--mut);font-size:12px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{padding:1px 9px;font-size:16px;line-height:22px}
.qty span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.tot{font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .big{font-size:21px;font-weight:700;border-top:1px solid var(--ink);margin-top:5px;padding-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts .full{grid-column:1/-1}
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tbl{padding:14px;text-align:left;min-height:100px;background:#fff;border-left:6px solid var(--pri)}
.tbl.busy{border-left-color:var(--amb);background:#fffaf0}
.tbl b{font-size:18px}
.tkts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.tkt{background:#fff;border:1px solid var(--line);border-top:5px solid var(--amb);border-radius:6px;padding:10px}
.tkt.late{border-top-color:var(--red)}
.tkt .it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat span{font-size:12px;color:var(--mut)} .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
#modal{position:fixed;inset:0;background:rgba(20,30,40,.5);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
#modal.on{display:flex}
.box{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.box.wide{max-width:760px}
.box h2{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:10px}
.fld.chk label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin:0}
.fld.chk input{width:auto}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14312c;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:30;max-width:90vw}
#toast.err{background:var(--red)}
.login{max-width:340px;margin:12vh auto;padding:0 14px}
.mut{color:var(--mut)} .empty{padding:26px;text-align:center;color:var(--mut)}
.pill{background:#e8a317;border:0;color:#2b1d00;font-weight:600;border-radius:20px;padding:3px 12px;font-size:13px}
.pill.warn{background:#c8372d;color:#fff}.pill:disabled{cursor:default}
.who .pill{background:#e8a317;color:#2b1d00;border:0;padding:3px 12px}.who .pill.warn{background:#c8372d;color:#fff}
.btnlink{display:inline-block;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;color:var(--ink);font-size:14px}
.who .btnlink{background:none;color:#cfe3de;border-color:#3b5c55;padding:4px 9px;font-size:15px}
.btnlink:hover{border-color:var(--pri)}
.banner{background:#fff4d6;border-bottom:1px solid #f0d78b;padding:8px 14px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
.steps{counter-reset:s;list-style:none;margin:0 0 6px;padding:0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line)}
.steps li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.codebox{font:600 20px/1 "Consolas","Courier New",monospace;letter-spacing:1px;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:12px;padding:11px 14px;min-width:0}
.kpi span{font-size:12px;color:var(--mut);display:block}
.kpi b{font-size:21px;font-variant-numeric:tabular-nums;display:block;line-height:1.3;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--mut)}
.kpi.amb{border-left-color:var(--amb)}.kpi.red{border-left-color:var(--red)}.kpi.blu{border-left-color:#2f6fdb}.kpi.pur{border-left-color:#7a4fd6}
.up{color:#0a7a3f;font-weight:600}.dn{color:var(--red);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:14px}
.cc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.cc h3{margin:0 0 8px;font-size:15px}.cc h3 small{font-weight:400;color:var(--mut);font-size:12px;margin-left:6px}
.donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.leg{list-style:none;margin:0;padding:0;flex:1;min-width:140px}
.leg li{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.leg i{width:11px;height:11px;border-radius:3px;flex:none}.leg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .hbr{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .ht{background:#eef1f4;border-radius:5px;height:12px;overflow:hidden;display:block}.hb .ht i{display:block;height:100%;border-radius:5px}
.ib{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:8px;color:#4a5b6e}
.ib svg{width:17px;height:17px}
.ib:hover{background:var(--soft);color:var(--pri)}.ib.d:hover{background:#fbe3e0;color:var(--red)}.ib.w:hover{background:#fdf0d0;color:#8a5b00}
td.a,th.a{white-space:nowrap;text-align:right;width:1%}
.bdg{display:inline-block;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:4px;font-weight:700;line-height:17px}
.msg-unread td{font-weight:700;background:#fbfdfc}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.copyrow{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:8px 12px;margin:6px 0;font-weight:600;word-break:break-all}
.temp{font:700 26px/1.2 Consolas,"Courier New",monospace;letter-spacing:2px;background:#fff8e6;border:2px dashed var(--amb);border-radius:10px;padding:12px;text-align:center;margin:10px 0}
.note{background:#f6f9fb;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.note ol,.note ul{margin:6px 0 0 18px;padding:0}
.fld small{color:var(--mut)}
@media(max-width:600px){main{padding:10px}.ib{width:40px;height:40px}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:18px}.charts{grid-template-columns:1fr}header b{padding:8px 0}nav button{padding:10px 8px}.bar input,.bar select{width:100%}.donut svg{width:120px;height:120px}}
@media(max-width:900px){.who{flex-wrap:wrap;white-space:normal;gap:6px}.who .btnlink,.who button{padding:6px 10px}}

.btnlink.buy,.who .btnlink.buy{background:var(--amb);border-color:var(--amb);color:#2b1d00;font-weight:700}
.who .ib.hdr{color:#cfe3de}.who .ib.hdr:hover{background:rgba(255,255,255,.12);color:#fff}
.banner.urgent{background:#fde8e6;border-color:#f0b4ae}
.cta{border-left:5px solid var(--amb);background:linear-gradient(90deg,#fffaf0,#fff)}
.prog{height:8px;border-radius:5px;background:#eef1f4;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--amb)}
.card.buy{background:linear-gradient(135deg,#14312c,#0f7b6c);color:#fff;border:0}
.card.buy .bigprice{font-size:34px;font-weight:800;line-height:1.1}.card.buy s{opacity:.6;font-size:20px;font-weight:600}
.card.buy button.amber{background:var(--amb);border-color:var(--amb);color:#2b1d00;font-weight:700;padding:12px 22px;font-size:16px}
.perks{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:12px;color:#dff2ee;font-size:14px}
.tips{margin:0;padding-left:18px}.tips li{padding:3px 0}
.pal .it{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}.pal .it.on,.pal .it:hover{background:var(--soft)}.pal{margin-top:8px;max-height:50vh;overflow:auto}
body.dark{--ink:#e6edf3;--mut:#9fb0c0;--line:#2c3a46;--bg:#0f161c;--card:#17212a;--soft:#1d3a35}
body.dark .card,body.dark .kpi,body.dark .cc,body.dark .tile,body.dark .tbl,body.dark .tkt,body.dark .stat,body.dark .box,body.dark .ticket,body.dark .note,body.dark input,body.dark select,body.dark textarea,body.dark button:not(.pri):not(.dng):not(.pill):not(.ib):not(.amber):not(.chip.on),body.dark .btnlink:not(.buy){background:var(--card);color:var(--ink);border-color:var(--line)}
body.dark .card.buy{background:linear-gradient(135deg,#14312c,#0f7b6c)}
body.dark th{background:#1d2a34;color:var(--mut)}body.dark td,body.dark th{border-color:var(--line)}
body.dark .tbl.busy{background:#2a2412}body.dark .banner{background:#3a3115;color:#f5e6b0;border-color:#5a4a1c}body.dark .banner.urgent{background:#3b1d1b;color:#ffd6d2;border-color:#6a2b27}
body.dark .temp{background:#2a2412;color:#ffd37a}body.dark .copyrow{background:#1d3a35}body.dark .tag{background:#27333d;color:#cdd8e2}body.dark .line{border-color:var(--line)}body.dark .cta{background:linear-gradient(90deg,#2a2412,var(--card))}
body.dark svg text{fill:#d7e0e8!important}body.dark svg line{stroke:#2c3a46!important}body.dark svg circle[stroke="#eef1f4"]{stroke:#26323c!important}body.dark .hb .ht,body.dark .prog{background:#26323c}
body.dark .ib{color:#b8c7d4}body.dark .ib:hover{background:var(--soft);color:#fff}body.dark a{color:#5fd0bd}body.dark .tkt.late{border-top-color:var(--red)}
header{flex-wrap:wrap;row-gap:0}
header nav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
header nav button{font-size:14px;padding:9px 9px}
@media(max-width:900px){header nav{flex-wrap:wrap;overflow-x:visible}header nav button{padding:10px 8px}}

/* ===== responsive layout: sidebar (desktop), icon rail (tablet), bottom tab bar (phone) ===== */
header.top{display:flex;align-items:center;gap:8px;padding:0 12px;height:54px;position:sticky;top:0;z-index:30}
header.top .brand{display:flex;align-items:center;gap:9px;min-width:0}header.top .brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
header.top .logo{height:32px;width:32px;border-radius:7px;object-fit:cover;background:#fff}
.usr{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;padding:4px 6px;border-radius:10px}.usr:hover{background:rgba(255,255,255,.12)}
.usr .usrname{display:flex;flex-direction:column;text-align:left;line-height:1.15}.usr small{opacity:.75;font-size:11px}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#2d6f65;color:#fff;font-weight:700;font-size:13px;overflow:hidden;flex:none}.av.sm{width:30px;height:30px;font-size:12px}.av.lg{width:48px;height:48px;font-size:16px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th{width:36px;height:36px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px;background:#eef1f4}
.body{display:flex;align-items:flex-start}
.side{width:218px;flex:none;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:8px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:none;border-radius:9px;color:var(--ink);text-align:left;position:relative;font-size:14.5px}
.nv svg{width:20px;height:20px;flex:none}.nv:hover{background:var(--soft)}.nv.on{background:var(--soft);color:var(--pri2);font-weight:700}

main{flex:1;min-width:0;padding:14px;max-width:1500px;margin:0 auto}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.tabbar .nv{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;color:var(--mut);align-items:center;justify-content:center;border-radius:10px;min-width:0}
.tabbar .nv .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.tabbar .nv.on{color:var(--pri);background:var(--soft)}.tabbar .nv .bdg{position:absolute;top:2px;right:18%;margin:0}
.menu{display:flex;flex-direction:column;gap:2px}.mi{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:0;background:none;text-decoration:none;color:var(--ink);text-align:left;font-size:15px;width:100%}.mi:hover{background:var(--soft)}.mi svg{width:20px;height:20px;color:var(--pri)}
.more{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px}.mo svg{width:24px;height:24px;color:var(--pri)}.mo.on{background:var(--soft);border-color:var(--pri)}
.imgbox{display:flex;gap:12px;align-items:center}.imgprev{width:76px;height:76px;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);flex:none}.imgprev img{width:100%;height:100%;object-fit:cover}.imgprev svg{width:30px;height:30px}

.cartbar{display:none}
.hdr-hide{display:none}

@media(max-width:699px){.side{display:none}.tabbar{display:flex}main{padding:10px 10px 88px}.hide-xs{display:none!important}header.top .brand b{max-width:46vw}
 .pos{grid-template-columns:1fr!important}.ticket{position:fixed!important;inset:0;top:0!important;z-index:60;max-height:none!important;border-radius:0;display:none;margin:0}.ticket.open{display:flex}
 .cartbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--pri);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-weight:700;justify-content:space-between;box-shadow:0 8px 20px rgba(0,0,0,.25)}
 .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))!important}.tbls{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important}.tkts{grid-template-columns:1fr!important}.row2{grid-template-columns:1fr!important}}

  /* ---- orders ---- */

  function full(id) {
    var o = orders.filter(function (x) { return x.id === id; })[0]; if (!o) return null;
    var c = JSON.parse(JSON.stringify(o)); c.table_name = tableName(o.table_id); c.waiter_name = userName(o.waiter_id); c.cashier_name = userName(o.cashier_id);

  function err(msg, code) { var e = new Error(msg); e.code = code || 400; return e; }
  function rangeOf(q) { var t = dayStr(new Date()); return [q.from || t, q.to || q.from || t]; }

  function report(q) {

    var days = group(paid, function (o) { return o.paid_at.substr(0, 10); }, function (m, o) { m.orders++; m.sales += o.total; }).sort(function (a, b) { return a.k < b.k ? -1 : 1; }).map(function (m) { return { day: m.k, orders: m.orders, sales: round2(m.sales) }; });
    var kinds = group(paid, function (o) { return o.kind; }, function (m, o) { m.orders++; m.sales += o.total; }).map(function (m) { return { kind: m.k, orders: m.orders, sales: round2(m.sales) }; });
    var cats = group(its, function (i) { var p = prod(i.product_id), c = p && categories.filter(function (x) { return x.id === p.category_id; })[0]; return c ? c.name : 'Uncategorised'; }, function (m, i) { m.sales += i.qty * i.price; }).sort(function (a, b) { return b.sales - a.sales; }).map(function (m) { return { name: m.k, sales: round2(m.sales) }; });
    var top = group(its, function (i) { return i.name; }, function (m, i) { m.qty += i.qty; m.sales += i.qty * i.price; }).sort(function (a, b) { return b.sales - a.sales; }).slice(0, 15).map(function (m) { return { name: m.k, qty: m.qty, sales: round2(m.sales) }; });
    var staff = group(paid, function (o) { return userName(o.cashier_id) || '-'; }, function (m, o) { m.orders++; m.sales += o.total; }).map(function (m) { return { name: m.k, orders: m.orders, sales: round2(m.sales) }; });
    var low = products.filter(function (p) { return p.active && p.track_stock && p.stock <= p.reorder_level; }).sort(function (a, b) { return a.stock - b.stock; }).map(function (p) { return { name: p.name, stock: p.stock, reorder_level: p.reorder_level, unit: p.unit }; });
    var sv = 0; products.forEach(function (p) { if (p.active && p.track_stock && p.stock > 0) sv += p.stock * p.cost; });

  function saveOrder(b) {

const EAN={L:['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],G:['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],R:['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'],
  P:['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL']};
function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return String((10-s%10)%10)}
function genBarcode(){let n='200';for(let i=0;i<9;i++)n+=Math.floor(Math.random()*10);return n+eanCheck(n)}
function ean13Svg(code,o){
  o=o||{};code=String(code||'').replace(/\D/g,'');if(code.length===12)code+=eanCheck(code);
  if(code.length!==13||eanCheck(code.slice(0,12))!==code[12])return '';
  const par=EAN.P[+code[0]];let bits='101';for(let i=1;i<=6;i++)bits+=EAN[par[i-1]][+code[i]];bits+='01010';for(let i=7;i<=12;i++)bits+=EAN.R[+code[i]];bits+='101';
  const mw=o.mw||2,h=o.h||60,qz=11*mw,w=bits.length*mw+qz*2;let bars='';
  for(let i=0;i<bits.length;i++)if(bits[i]==='1'){const guard=(i<3||(i>=45&&i<50)||i>=92);bars+=`<rect x="${qz+i*mw}" y="0" width="${mw}" height="${guard?h+8:h}"/>`}
  let t=`<text x="${qz-4*mw}" y="${h+18}" font-size="${mw*7}" text-anchor="end">${code[0]}</text>`;
  t+=`<text x="${qz+3*mw+21*mw}" y="${h+18}" font-size="${mw*7}" text-anchor="middle" letter-spacing="${mw*1.4}">${code.slice(1,7)}</text><text x="${qz+50*mw+21*mw}" y="${h+18}" font-size="${mw*7}" text-anchor="middle" letter-spacing="${mw*1.4}">${code.slice(7)}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h+24}" width="${o.px||w}" role="img" aria-label="Barcode ${code}"><rect width="${w}" height="${h+24}" fill="#fff"/><g fill="#000" font-family="Arial,sans-serif">${bars}${t}</g></svg>`}

function shrinkImage(file,max){return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type))return rej(new Error('Choose a picture (JPG, PNG or WebP)'));
  if(file.size>15*1024*1024)return rej(new Error('That picture is too large (15 MB maximum)'));
  const rd=new FileReader();rd.onerror=()=>rej(new Error('Could not read the picture'));
  rd.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Could not open that picture'));im.onload=()=>{const k=Math.min(1,(max||800)/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',0.8))};im.src=rd.result};rd.readAsDataURL(file)})}

  const sub=cart.items.reduce((a,i)=>a+i.qty*i.price,0),d0=Math.min(cart.discount||0,sub),used=Math.min(cart.redeem||0,maxRedeem()),disc=Math.min(sub,d0+used*pv()),base=sub-disc;
  const svc=cart.kind==='dine_in'?base*(+S.service_rate)/100:0,tax=(base+svc)*(+S.tax_rate)/100;
  return {sub,disc,used,svc,tax,total:Math.round((base+svc+tax)*100)/100}}
const beepTone=(f,d)=>{try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.connect(g);g.connect(_ac.destination);o.type='square';o.frequency.value=f;g.gain.value=.05;o.start();setTimeout(()=>o.stop(),d)}catch(e){}};

function matches(t){t=t.toLowerCase();return D.products.filter(p=>(!pcat||p.category_id===pcat)&&(!t||p.name.toLowerCase().includes(t)||(p.barcode||'').includes(t)))}
function bcFind(code){const raw=String(code||'').trim(),n=bcNorm(raw);if(!n)return null;return D.products.find(p=>p.barcode&&(p.barcode===raw||bcNorm(p.barcode)===n))||null}
async function scanCode(raw){
  raw=String(raw||'').trim();if(!raw)return false;let n=1;const m=raw.match(/^(\d+(\.\d+)?)\*(.+)$/);if(m){n=parseFloat(m[1]);raw=m[3].trim()}
  const p=bcFind(raw),sm=$('#scanmsg');

/* USB / Bluetooth scanners type fast and press Enter: catch them even when no box is focused */
const SCAN={buf:'',last:0};
document.addEventListener('keydown',e=>{
  if(page!=='pos'||!U||document.querySelector('#modal.on'))return;
  const t=e.target,tag=(t&&t.tagName)||'';if(e.ctrlKey||e.metaKey||e.altKey)return;
  if((tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')&&t.id!=='q')return;
  const now=Date.now();
  if(e.key==='Enter'){if(t.id!=='q'&&SCAN.buf.length>=4){e.preventDefault();const c=SCAN.buf;SCAN.buf='';scanCode(c)}else SCAN.buf='';return}
  if(e.key.length===1){if(now-SCAN.last>90)SCAN.buf='';SCAN.buf+=e.key;SCAN.last=now;if(t.id!=='q'){e.preventDefault();const q=$('#q');if(q){q.value=SCAN.buf;q.focus()}}}
  else if(e.key==='F2'){e.preventDefault();const q=$('#q');if(q)q.focus()}
},true);

async function camScan(){
  if(!('BarcodeDetector' in window)||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    openModal(`<h2>Camera scanning is not available here</h2><p class="mut" style="margin-top:0">Browsers only allow the camera on secure pages (https, or the server computer itself), and not every browser can read barcodes.</p><div class="note"><b>What works everywhere:</b><ul><li>A <b>USB or Bluetooth barcode scanner</b>: plug it in (or pair it), then simply scan. It works on this screen with no setup.</li><li>Type the code, or part of the name, in the search box.</li><li>Phone scanner apps that act as a Bluetooth keyboard also work.</li></ul></div><div class="foot"><button class="pri" onclick="closeModal()">OK</button></div>`);return}
  openModal(`<h2>Scan with the camera</h2><div style="position:relative"><video id="camv" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:60vh"></video></div><p class="mut" id="camm">Point the camera at a barcode. Keep it steady.</p><div class="foot"><button class="pri" onclick="camStop();closeModal()">Done</button></div>`);
  try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});CAM={st,stop:false};const v=$('#camv');v.srcObject=st;await v.play();let last='',lt=0;
    const loop=async()=>{if(!CAM||CAM.stop)return;try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;if(c!==last||Date.now()-lt>1800){last=c;lt=Date.now();const ok=await scanCode(c);const m=$('#camm');if(m)m.textContent=ok?'Added '+c:'Not found: '+c}}}catch(e){}requestAnimationFrame(loop)};loop()}
  catch(e){const m=$('#camm');if(m)m.textContent='Could not open the camera: '+(e.message||e)}}

async function addP(p,qty){

  if(!qty&&p.unit&&p.unit!=='pc'){qty=await ask(p.name,'Quantity ('+p.unit+')',1);if(!qty)return}

  if(p.track_stock&&S.allow_negative_stock!=='1'&&inCart+qty>p.stock+1e-9)return toast('Only '+qn(p.stock)+' '+p.unit+' of '+p.name+' in stock',true);

  if(ex)ex.qty=qn(ex.qty+qty);else cart.items.push({product_id:p.id,name:p.name,price:p.price,qty:qn(qty),note:'',unit:p.unit,to_kitchen:p.to_kitchen});

/* ---------- stock ---------- */
let SF={t:'',low:false};
async function pStock(){
  const list=await api('products/list');window._pl=list;
  const trk=list.filter(p=>p.track_stock&&p.active),l=trk.filter(p=>(!SF.t||p.name.toLowerCase().includes(SF.t.toLowerCase()))&&(!SF.low||p.stock<=p.reorder_level));
  const val=trk.reduce((a,p)=>a+Math.max(0,p.stock)*p.cost,0),retail=trk.reduce((a,p)=>a+Math.max(0,p.stock)*p.price,0),out=trk.filter(p=>p.stock<=0).length,low=trk.filter(p=>p.stock>0&&p.stock<=p.reorder_level).length;
  const byCat={};trk.forEach(p=>{const k=p.category||'Uncategorised';byCat[k]=(byCat[k]||0)+Math.max(0,p.stock)*p.cost});
  const lowest=trk.filter(p=>p.stock<=p.reorder_level).sort((a,b)=>a.stock-b.stock).slice(0,8).map(p=>({l:p.name,v:Math.max(0,p.stock),c:p.stock<=0?'#c8372d':'#e8a317'}));
  $('#main').innerHTML=`<h2>Stock</h2><div class="kpis">${kpi('Stock value (cost)',money(val),trk.length+' tracked items')}${kpi('Value at selling price',money(retail),'potential sales','blu')}${kpi('Potential profit',money(retail-val),'if all sold','pur')}${kpi('Low stock',low,'','amb')}${kpi('Out of stock',out,'','red')}</div>
  <div class="charts">${cc('Stock value by category',donut(Object.keys(byCat).map(k=>({l:k,v:byCat[k]})),{fmt:cur,center:'at cost'}))}${cc('Running low',hbar(lowest,{fmt:x=>qn(x)}),'units left')}</div>
  <div class="bar"><input id="st" class="grow" placeholder="Search item" value="${esc(SF.t)}"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="sl" style="width:auto" ${SF.low?'checked':''}> Low stock only</label>${csvBtn('exportProducts')}</div>
  <div class="card">${tbl([{h:'Item',f:p=>`<b>${esc(p.name)}</b>`},{h:'In stock',r:1,f:p=>`${p.stock<=p.reorder_level?'<span class="tag warn">':'<span>'}${qn(p.stock)} ${esc(p.unit)}</span>`},{h:'Reorder at',r:1,f:p=>qn(p.reorder_level)},{h:'Value',r:1,f:p=>money(Math.max(0,p.stock)*p.cost)},{a:1,f:p=>ib('recv','Receive stock',`recvStock(${p.id})`)+ib('count','Count / adjust',`adjStock(${p.id})`)+ib('hist','History',`moves(${p.id})`)}],l,'No tracked items match')}</div>`;
  $('#st').oninput=e=>{SF.t=e.target.value;clearTimeout(pStock.t);pStock.t=setTimeout(()=>go('stock'),350)};$('#sl').onchange=e=>{SF.low=e.target.checked;go('stock')}}

let RF=null;

  <div class="kpis">${kpi('Sales',money(s.sales),delta(s.sales,p.sales,'vs previous period'))}${kpi('Orders',s.orders,delta(s.orders,p.orders,'vs previous period'),'blu')}${kpi('Average order',money(s.average),'','pur')}${kpi('Gross profit',money(s.gross_profit),delta(s.gross_profit,p.gross_profit,'vs previous period'))}${kpi('Profit margin',margin+'%','of net sales','blu')}${kpi('Expenses',money(s.expenses),'','red')}${kpi('Net profit',money(s.net_profit),'after expenses',s.net_profit<0?'red':'')}${kpi('Discounts given',money(s.discounts),'','amb')}${kpi('Tax collected',money(s.tax),'service '+money(s.service),'pur')}${kpi('Stock value',money(r.stock_value),'at cost')}</div>

function rrange(f,t){RF={from:f,to:t};go('reports')}
function reportHtml(){const r=window._rep,s=r.summary;const T=(h,rows)=>`<h3>${h}</h3><table>${rows.map(x=>`<tr>${x.map((c,i)=>`<td class="${i?'r':''}">${c}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<html><head><meta charset="utf-8"><title>Report</title><style>body{font:13px Arial,sans-serif;margin:18mm;color:#000}h1{margin:0}h3{margin:16px 0 4px;border-bottom:1px solid #000}table{width:100%;border-collapse:collapse}td{padding:3px 4px;border-bottom:1px solid #ccc}.r{text-align:right}</style></head><body><h1>${esc(S.business_name)}</h1><p>Sales report: ${r.from} to ${r.to}</p>
  ${T('Summary',[['Sales',money(s.sales)],['Orders',s.orders],['Discounts given',money(s.discounts)],['Tax collected',money(s.tax)],['Cost of goods sold',money(s.cost)],['Gross profit',money(s.gross_profit)],['Expenses',money(s.expenses)],['Net profit',money(s.net_profit)]])}
  ${T('Payment methods',r.methods.map(x=>[METHOD[x.method]||x.method,money(x.amount)]))}${T('Sales by category',r.categories.map(x=>[esc(x.name),money(x.sales)]))}${T('Best sellers',r.top.map(x=>[esc(x.name)+' x'+qn(x.qty),money(x.sales)]))}${T('By day',r.days.map(x=>[x.day+' ('+x.orders+' orders)',money(x.sales)]))}</body></html>`}

function editUser(id){const u=Object.assign({role:'cashier',active:1,must_change:id?0:1},(window._us||[]).find(x=>x.id===id)||{});
  formModal(id?'Edit staff':'Add staff',[{k:'full_name',label:'Full name'},{k:'username',label:'Username (letters and numbers, no spaces)'},{k:'role',label:'Role',type:'select',options:['admin','manager','cashier','waiter','kitchen'].map(r=>[r,r])},{k:'password',label:id?'New password (leave blank to keep the current one)':'Password (6+ characters)',type:'password'},{k:'image',type:'image',kind:'user',ref:id,has:u.has_img,label:'Photo (optional)'},{k:'must_change',label:'Ask them to choose their own password at first sign-in',type:'checkbox'},{k:'active',label:'Active (can sign in)',type:'checkbox'}],u,async v=>{const r=await api('users/save',{full_name:v.full_name,username:v.username,role:v.role,password:v.password,must_change:v.must_change,active:v.active,id});await attachImage('user',r.id||id,v.image);closeModal();toast(id?'Staff updated':'Staff added');go('users')},true)}
function resetPw(id){const u=window._us.find(x=>x.id===id),self=id===U.id;

  openModal(`<h2>Reset password: ${esc(u.full_name)}</h2><p class="mut" style="margin-top:0">Leave the box empty to create a temporary password, or type one yourself. ${esc(u.full_name)} will be signed out and must choose a new password at the next sign-in.</p><div class="fld"><label for="rp">Password (optional)</label><input id="rp" type="text" autocomplete="off" placeholder="Leave empty to generate one"></div><div id="rpout"></div><div class="foot"><button onclick="closeModal()">Close</button><button class="pri" id="rpgo">Reset password</button></div>`);

function openPalette(){
  if(!U||gated())return;

    const t=q.value.trim().toLowerCase();PAL_ITEMS=[];
    NAV.filter(n=>n.r.split(' ').includes(U.role)&&(!n.m||n.m.split(' ').includes(S.mode))).concat(['admin','manager','cashier'].includes(U.role)?[{id:'cashup',t:'Cash-up'}]:[]).filter(n=>!t||n.t.toLowerCase().includes(t)).slice(0,6).forEach(n=>PAL_ITEMS.push({k:'Page',l:n.t,fn:()=>go(n.id)}));

      if(U.role==='admin'){try{(await api('users')).filter(u=>(u.full_name+u.username).toLowerCase().includes(t)).slice(0,4).forEach(u=>PAL_ITEMS.push({k:'Staff',l:u.full_name+'  ·  '+u.role,fn:()=>{go('users')}}))}catch(e){}}
    }

  draw()}

<script>
(function () {
  // logo pictures: the browser asks the address /api/image/get, so point those at the stored picture
  function fixImgs() {
    document.querySelectorAll('img[src*="/api/image/get"]').forEach(function (img) {
      var u = new URL(img.getAttribute('src'), location.href);
      var k = (u.searchParams.get('kind') || '') + ':' + (u.searchParams.get('ref') || 0);
      var want = (window.__okvImgs && window.__okvImgs[k]) || 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="32" fill="#dfe8e5"/><circle cx="32" cy="26" r="11" fill="#14312c"/><path d="M12 58c3-12 13-17 20-17s17 5 20 17z" fill="#14312c"/></svg>');
      if (img.src !== want) img.src = want;
    });
  }
  new MutationObserver(fixImgs).observe(document.body, { childList: true, subtree: true });
  // "Stop the server now" really stops it until you start it again
  var box = document.createElement('div'); box.id = 'okvStopped';
  box.innerHTML = '<div><b style="font-size:20px">The OKV RMS server is stopped</b><br>Staff cannot use the system until it is started again.<br><button type="button" id="okvStart">Start the server</button></div>';
  document.body.appendChild(box);
  document.getElementById('okvStart').onclick = function () { serverStopped = false; box.classList.remove('on'); if (window.toast) toast('Server started'); };
  stopServer = async function () { serverStopped = true; box.classList.add('on'); };
  backupNow = async function () { await run(async () => { const r = await api('backup/run', {}); toast('Backup saved: ' + r.file); }); };
  signOut = async function () { toast('Sign-out is off in this demo. Use the role buttons at the bottom right to see other roles.'); };
  var bar = document.createElement('div'); bar.id = 'okvRoles';
  var names = [['admin', 'Admin'], ['manager', 'Manager'], ['cashier', 'Cashier'], ['waiter', 'Waiter'], ['kitchen', 'Kitchen']];
  var current = (new URLSearchParams(location.search).get('role') || 'admin');
  bar.innerHTML = '<b>View as</b>' + names.map(function (n) { return '<button type="button" data-role="' + n[0] + '"' + (n[0] === current ? ' class="on"' : '') + '>' + n[1] + '</button>'; }).join('') + '<button type="button" class="ghost" data-reset="1">Reset sample data</button>';
  document.body.appendChild(bar);
  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;

<script>
(function () {
  // Full-version-only controls in this demo: shown, but locked, with a call to action.
  var LOCK_IDS = ['codein', 'fp_o', 'fp_n', 'fp_c', 'sv_auto', 'sv_keep', 'logofile'];
  var LOCK_BTN = /^(Activate|Save and continue|Change password|Update password|Choose logo|Remove logo)$/i;
  var CTA = '<a class="okv-cta" href="pricing.html" target="_blank" rel="noopener">Full version only: buy to unlock</a>';
  function lock() {
    LOCK_IDS.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el || el.getAttribute('data-demo-lock')) return;
      el.setAttribute('data-demo-lock', '1'); el.disabled = true; el.setAttribute('aria-disabled', 'true');
      el.title = 'Locked in the demo. Buy the full version to use this.';
      var host = el.closest('.fld') || el.parentElement;
      if (host && !host.querySelector('.okv-cta')) host.insertAdjacentHTML('beforeend', CTA);
    });
    document.querySelectorAll('button').forEach(function (b) {
      if (b.getAttribute('data-demo-lock') || !LOCK_BTN.test((b.textContent || '').trim())) return;
      var c = b.parentElement, n = 0;
      while (c && n++ < 6) {
        if (c.querySelector('[data-demo-lock]')) { b.setAttribute('data-demo-lock', '1'); b.disabled = true; b.title = 'Full version only'; break; }
        c = c.parentElement;
      }
    });
  }
  lock();
  new MutationObserver(lock).observe(document.body, { childList: true, subtree: true });
})();
</script>
